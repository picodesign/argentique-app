<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap">
  <style>
    :root {
      --ink: #1B1A17;
      --ink-soft: #6E6A60;
      --crema: #F6F2E9;
      --hairline: #DED8CA;
      --accent: {{accent}};
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent); } a:hover { color: #92381f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: var(--crema); font-family: var(--font-ui); padding: 64px 20px 40px; display: flex; flex-direction: column;">

  <div style="font-family: var(--font-serif); font-weight: 600; font-size: 30px; color: var(--ink); margin-bottom: 4px;">Archives</div>
  <div style="font-size: 13px; color: var(--ink-soft); margin-bottom: 20px;">5 pellicules développées</div>

  <div style="display: flex; flex-direction: column;">
    <sc-for list="{{rolls}}" as="roll">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--hairline);">
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="font-size: 15px; font-weight: 600; color: var(--ink);">{{roll.name}}</div>
            <sc-if value="{{roll.current}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: rgba(180,71,47,0.12);">
                <div style="width: 5px; height: 5px; border-radius: 999px; background: var(--accent);"></div>
                <span style="font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em;">En cours</span>
              </div>
            </sc-if>
          </div>
          <div style="font-size: 13px; color: var(--ink-soft); margin-top: 3px;">{{roll.meta}}</div>
        </div>
        <div style="display: flex; gap: 3px;">
          <sc-for list="{{roll.swatches}}" as="sw">
            <div style="width: 20px; height: 20px; border-radius: 3px; background: {{sw}};"></div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B4472F","options":["#B4472F","#8A6D3B","#4E6E58"]}}'>
class Component extends DCLogic {
  renderVals() {
    const rolls = [
      { name: 'Pellicule N°14', meta: '22 restantes', current: true, swatches: ['#C89A6A', '#A8785A', '#8E9A7C'] },
      { name: 'Pellicule N°13', meta: '27 août · 36 photos', current: false, swatches: ['#E3A76F', '#9AAE86', '#7C93A8'] },
      { name: 'Pellicule N°12', meta: '13 août · 36 photos', current: false, swatches: ['#D8B37C', '#C9877A', '#8FA6A0'] },
      { name: 'Pellicule N°11', meta: '30 juillet · 36 photos', current: false, swatches: ['#B98C63', '#7C8B98', '#C4A67C'] },
      { name: 'Pellicule N°10', meta: '16 juillet · 36 photos', current: false, swatches: ['#9C8468', '#B2795E', '#8E9A7C'] }
    ];
    return { accent: this.props.accent ?? '#B4472F', rolls };
  }
}
</script>
</body>
</html>
