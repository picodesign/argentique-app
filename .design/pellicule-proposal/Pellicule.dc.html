<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap">
  <style>
    :root {
      --ink: #1B1A17;
      --ink-soft: #6E6A60;
      --crema: #F6F2E9;
      --hairline: #DED8CA;
      --accent: {{accent}};
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent); } a:hover { color: #92381f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: var(--crema); font-family: var(--font-ui); padding: 64px 24px 40px; display: flex; flex-direction: column;">

  <div style="font-size: 12px; letter-spacing: 0.08em; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 6px;">Pellicule N°14</div>
  <div style="font-family: var(--font-serif); font-weight: 600; font-size: 30px; color: var(--ink); margin-bottom: 24px;">22 photos restantes</div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px;">

    <sc-for list="{{cells}}" as="cell">
      <sc-if value="{{cell.filled}}" hint-placeholder-val="{{true}}">
        <div style="aspect-ratio: 1; border-radius: 4px; background: {{cell.tone}};"></div>
      </sc-if>
      <sc-if value="{{cell.empty}}" hint-placeholder-val="{{false}}">
        <div style="aspect-ratio: 1; border-radius: 4px; border: 1.4px dashed var(--hairline);"></div>
      </sc-if>
    </sc-for>

  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; align-items: center; gap: 8px;">
    <div style="width: 5px; height: 5px; border-radius: 999px; background: var(--accent); flex-shrink: 0;"></div>
    <div style="font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--ink-soft);">Les photos d'aujourd'hui seront visibles demain à 8h00.</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B4472F","options":["#B4472F","#8A6D3B","#4E6E58"]}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = ['#C89A6A', '#A8785A', '#8E9A7C', '#B98C63', '#7C8B98', '#C4A67C', '#9C8468', '#B2795E'];
    const cells = [];
    for (let i = 0; i < 36; i++) {
      const filled = i < 14;
      cells.push({ filled, empty: !filled, tone: tones[i % tones.length] });
    }
    return { accent: this.props.accent ?? '#B4472F', cells };
  }
}
</script>
</body>
</html>
