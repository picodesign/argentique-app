<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap">
  <style>
    :root {
      --ink: #1B1A17;
      --ink-soft: #6E6A60;
      --crema: #F6F2E9;
      --surface: #FFFDF8;
      --hairline: #DED8CA;
      --accent: {{accent}};
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent); } a:hover { color: #92381f; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: var(--crema); font-family: var(--font-ui); padding: 60px 20px 24px; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    <div>
      <div style="font-size: 11px; letter-spacing: 0.08em; font-weight: 600; color: var(--ink-soft); text-transform: uppercase;">Pellicule N°13</div>
      <div style="font-family: var(--font-serif); font-weight: 600; font-size: 20px; color: var(--ink);">Développée le 27 août</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; padding-left: 30px;">
    <span>36 photos</span>
    <div style="width: 3px; height: 3px; border-radius: 999px; background: var(--ink-soft);"></div>
    <span style="color: var(--accent); font-weight: 600;">Terminée</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
    <sc-for list="{{photos}}" as="photo">
      <div style="background: var(--surface); padding: 6px 6px 12px; border-radius: 3px; box-shadow: 0 6px 16px rgba(27,26,23,0.12); transform: rotate({{photo.tilt}}deg);">
        <div style="aspect-ratio: 4/5; border-radius: 2px; background: {{photo.tone}};"></div>
        <div style="font-size: 10px; color: var(--ink-soft); text-align: center; margin-top: 8px;">{{photo.caption}}</div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#B4472F","options":["#B4472F","#8A6D3B","#4E6E58"]}}'>
class Component extends DCLogic {
  renderVals() {
    const photos = [
      { tone: 'linear-gradient(160deg, #E3A76F 0%, #B4472F 100%)', caption: '27 août — 08:14', tilt: -1.4 },
      { tone: 'linear-gradient(160deg, #9AAE86 0%, #4E6E58 100%)', caption: '25 août — 17:02', tilt: 1.2 },
      { tone: 'linear-gradient(160deg, #7C93A8 0%, #3E5164 100%)', caption: '22 août — 19:40', tilt: 1.6 },
      { tone: 'linear-gradient(160deg, #D8B37C 0%, #8A6D3B 100%)', caption: '19 août — 12:20', tilt: -1.1 },
      { tone: 'linear-gradient(160deg, #C9877A 0%, #7A4438 100%)', caption: '15 août — 09:55', tilt: 1.3 },
      { tone: 'linear-gradient(160deg, #8FA6A0 0%, #40564F 100%)', caption: '12 août — 21:08', tilt: -1.7 }
    ];
    return { accent: this.props.accent ?? '#B4472F', photos };
  }
}
</script>
</body>
</html>
